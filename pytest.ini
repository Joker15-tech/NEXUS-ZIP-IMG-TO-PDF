# =====================================================================
# NEXUS QUANTUM // Pytest Configuration
# =====================================================================
# File: pytest.ini
#
# Runs the entire Python test suite with:
#   - Strict marker enforcement (typos fail fast)
#   - Coverage of shared + python modules with branch tracking
#   - HTML + XML reports for CI
#   - Warning-as-error discipline for deprecations
#   - importlib import mode (modern, no sys.path hacking)
#
# Install dev deps first:
#   pip install -r requirements-dev.txt
# =====================================================================

[pytest]

# ---------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------
python_files    = test_*.py *_test.py
python_classes  = Test*
python_functions = test_*

testpaths = tests

minversion = 7.0

# ---------------------------------------------------------------------
# Import mode
# ---------------------------------------------------------------------
# importlib avoids sys.path mutation and is the recommended mode for
# projects with nested test packages (tests/, shared/, python/).
addopts =
    --import-mode=importlib

# ---------------------------------------------------------------------
# Output & verbosity
# ---------------------------------------------------------------------
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --durations=10
    --tb=short

# ---------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------
# Requires pytest-cov (see requirements-dev.txt).
# Remove the entire block if you want fast unit-test runs without
# coverage — or override with: pytest -p no:cov
addopts =
    --cov=shared
    --cov=python
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# ---------------------------------------------------------------------
# Warnings
# ---------------------------------------------------------------------
# Treat specific warnings as errors so we notice breaking changes early.
# Other warnings are collected but don't fail the run.
filterwarnings =
    error::DeprecationWarning:shared.*
    error::DeprecationWarning:python.*
    error::PendingDeprecationWarning
    default::DeprecationWarning
    default::UserWarning
    ignore::ResourceWarning

# ---------------------------------------------------------------------
# xfail policy
# ---------------------------------------------------------------------
xfail_strict = true

# ---------------------------------------------------------------------
# Markers
# ---------------------------------------------------------------------
# Every custom marker MUST be declared here, otherwise `--strict-markers`
# will fail the run.
markers =
    unit: Fast, isolated unit tests (< 100ms each)
    integration: Integration tests across multiple modules (< 5s each)
    e2e: End-to-end tests covering the full pipeline (< 30s each)
    slow: Tests that take more than ~1 second
    very_slow: Tests that take more than ~10 seconds
    requires_pillow: Tests that require the Pillow library
    requires_no_pillow: Tests that require Pillow to be UNAVAILABLE
    posix_only: Tests that only run on POSIX (Linux / macOS)
    windows_only: Tests that only run on Windows
    network: Tests that require network access
    flaky: Tests known to be occasionally flaky

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# ---------------------------------------------------------------------
# Test timeout (requires pytest-timeout)
# ---------------------------------------------------------------------
# Uncomment to enable per-test timeouts globally
# timeout = 60
# timeout_method = thread

# =====================================================================
# COVERAGE CONFIGURATION
# =====================================================================
# Note: in coverage.py 7+, you can use pyproject.toml instead. This
# block is kept here for compatibility with older setups.

[coverage:run]
source = shared,python
branch = True
parallel = False
omit =
    tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */env/*
    */site-packages/*
    setup.py
    conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_empty = True
skip_covered = False
sort = Miss

exclude_lines =
    # Standard pragma
    pragma: no cover

    # Don't complain about missing debug code
    def __repr__

    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError

    # Don't complain if non-runnable code isn't run
    if __name__ == "__main__":
    if __name__ == '__main__':

    # Don't complain about type checking code
    if TYPE_CHECKING:

    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod

    # Don't complain about Protocol method stubs
    \.\.\.

    # Don't complain about coverage.py's own pragmas
    # pragma: no branch

[coverage:html]
directory = htmlcov
title = NEXUS QUANTUM Coverage Report

[coverage:xml]
output = coverage.xml
